"An address seen trading Uniswap v4 on Ethereum mainnet, and what its behaviour looks like."
type MainnetTrader @entity(immutable: false) {
  id: Bytes!
  address: String!
  "Swaps where this address was the caller of the PoolManager."
  swaps: BigInt!
  "Times it opened and closed a position around somebody else's trade in one block."
  sandwiches: BigInt!
  "Distinct transaction senders behind it. Many means shared infrastructure, not one operator."
  originators: BigInt!
  firstBlock: BigInt!
  lastBlock: BigInt!
}
