specVersion: 1.3.0
description: >
  Behaviour of every address trading Uniswap v4 on Ethereum mainnet: swaps, distinct
  originators, and sandwiches detected from the order of swaps inside a block.
repository: https://github.com/wildanrhmn/gantry
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PoolManager
    network: mainnet
    source:
      abi: PoolManager
      address: "0x000000000004444c5dc75cB358380D2e3dE08A90"
      startBlock: 25940000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Scan
        - MainnetTrader
        - OriginatorLink
        - BlockPool
        - RawSwap
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
