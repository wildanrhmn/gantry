specVersion: 1.3.0
description: Behaviour tiers and the tolls they produce in a Gantry pool.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Gantry
    network: sepolia
    source:
      abi: Gantry
      address: "0x42A5B912625E0b9Aba3286CEfA3BB823DDAE0080"
      startBlock: 11677077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/gantry.ts
      entities:
        - Trader
        - Toll
        - Venue
      abis:
        - name: Gantry
          file: ./abis/Gantry.json
      eventHandlers:
        - event: Tolled(indexed address,uint8,uint24)
          handler: handleTolled
  - kind: ethereum
    name: GantryV2
    network: sepolia
    source:
      abi: Gantry
      address: "0xa3D2A9ee28198496D5DF469A8FF149aD2d780080"
      startBlock: 11677900
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/gantry.ts
      entities:
        - Trader
        - Toll
        - Venue
      abis:
        - name: Gantry
          file: ./abis/Gantry.json
      eventHandlers:
        - event: Tolled(indexed address,uint8,uint24)
          handler: handleTolled

  - kind: ethereum
    name: TierOracle
    network: sepolia
    source:
      abi: TierOracle
      address: "0x846d3eF24c3c6e079Bd95cFeACC08B21427C9132"
      startBlock: 11677077
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/oracle.ts
      entities:
        - Trader
        - TierChange
      abis:
        - name: TierOracle
          file: ./abis/TierOracle.json
      eventHandlers:
        - event: TierSet(indexed address,uint8)
          handler: handleTierSet
