specVersion: 1.3.0
description: Behaviour tiers and the tolls they produce in a Gantry pool.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Gantry
    network: sepolia
    source:
      abi: Gantry
      # replace with the deployed Gantry address and the block it landed in
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/gantry.ts
      entities:
        - Trader
        - Toll
        - Venue
      abis:
        - name: Gantry
          file: ./abis/Gantry.json
      eventHandlers:
        - event: Tolled(indexed address,uint8,uint24)
          handler: handleTolled
  - kind: ethereum
    name: TierOracle
    network: sepolia
    source:
      abi: TierOracle
      # replace with the deployed TierOracle address and the block it landed in
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/oracle.ts
      entities:
        - Trader
        - TierChange
      abis:
        - name: TierOracle
          file: ./abis/TierOracle.json
      eventHandlers:
        - event: TierSet(indexed address,uint8)
          handler: handleTierSet
