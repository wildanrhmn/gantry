specVersion: v0.1.0
package:
  name: gantry
  version: v0.1.0
  url: https://github.com/wildanrhmn/gantry
  description: Uniswap v4 swap extraction and sandwich detection.

network: mainnet

protobuf:
  files:
    - gantry/v1/gantry.proto
    - sf/substreams/entity/v1/entity.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/gantry_substreams.wasm

modules:
  - name: map_swaps
    kind: map
    initialBlock: 25900000
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:gantry.v1.Swaps

  - name: map_sandwiches
    kind: map
    initialBlock: 25900000
    inputs:
      - map: map_swaps
    output:
      type: proto:gantry.v1.Sandwiches

  - name: map_attempts
    kind: map
    initialBlock: 25900000
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:gantry.v1.Attempts

  - name: store_counts
    kind: store
    initialBlock: 25900000
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_swaps
      - map: map_sandwiches
      - map: map_attempts

  - name: store_seen_originators
    kind: store
    initialBlock: 25900000
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_swaps

  - name: store_originators
    kind: store
    initialBlock: 25900000
    updatePolicy: add
    valueType: int64
    inputs:
      - store: store_seen_originators
        mode: deltas

  - name: store_first_block
    kind: store
    initialBlock: 25900000
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_swaps

  - name: store_last_block
    kind: store
    initialBlock: 25900000
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_swaps

  - name: graph_out
    kind: map
    initialBlock: 25900000
    inputs:
      - map: map_swaps
      - store: store_counts
      - store: store_originators
      - store: store_first_block
      - store: store_last_block
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges
